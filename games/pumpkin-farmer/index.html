<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#d3dcdb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="Quarter Sun Cove: a foggy little coastal pumpkin farm.">
<title>Quarter Sun Cove</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cellipse cx='16' cy='19' rx='13' ry='10' fill='%23d9782d'/%3E%3Cpath d='M16 9c0-3 1-5 3-6' stroke='%236e6a3e' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Nunito+Sans:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="src/ui/css/base.css">
<link rel="stylesheet" href="src/ui/css/patch.css">
<link rel="stylesheet" href="src/ui/css/giant.css">
<link rel="stylesheet" href="src/ui/css/season.css">
<link rel="stylesheet" href="src/ui/css/weighoff.css">
<link rel="stylesheet" href="src/ui/css/winter.css">
<link rel="stylesheet" href="src/ui/css/banner.css">
<link rel="stylesheet" href="src/ui/css/mischief.css">
<link rel="stylesheet" href="src/ui/css/shelf.css">
<link rel="stylesheet" href="src/ui/css/crawl.css">
<link rel="stylesheet" href="src/ui/css/firsts.css">
<link rel="stylesheet" href="src/ui/css/pokes.css">
<link rel="stylesheet" href="src/ui/css/road.css">
<link rel="stylesheet" href="src/ui/css/hands.css">
</head>
<body class="booting">
<!-- The 3D diorama fills the screen; every UI layer floats above it, inside the safe area. -->
<div id="stage" aria-hidden="true"></div>
<div id="pins" class="layer"></div>
<div id="game-ui" class="layer" hidden>
  <header id="hud"></header>
  <div id="nextup"></div>
  <div id="wkrow"></div>
  <div id="dialog" aria-live="polite"></div>
  <div id="toasts" aria-live="polite"></div>
  <div id="tray">
    <nav id="stations" aria-label="Stations"></nav>
    <div id="dock"></div>
  </div>
</div>
<div id="screens" class="layer"></div>
<div id="title" class="layer"></div>
<div id="sheet-layer" class="layer"><section id="sheet" aria-modal="false"></section></div>
<div id="cards" class="layer"></div>
<div id="curtain" aria-hidden="true"></div>
<div id="debug" hidden></div>
<noscript><p class="noscript">Quarter Sun Cove needs JavaScript and WebGL.</p></noscript>
<script type="module" src="src/main.js"></script>
</body>
</html>
