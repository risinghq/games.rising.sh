<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reef</title>
    <style>
      :root {
        --blue: #1d4ed8;
        --red: #b91c1c;
        --sea: #e0f2fe;
        --ink: #0f172a;
      }
      body {
        font:
          16px/1.4 system-ui,
          sans-serif;
        color: var(--ink);
        max-width: 36rem;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      h1 {
        margin-bottom: 0.25rem;
      }
      .blue {
        color: var(--blue);
      }
      .red {
        color: var(--red);
      }
      #dives {
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        gap: 0.25rem;
        padding: 0;
        margin: 1rem 0;
        list-style: none;
      }
      #dives li {
        min-height: 4.5rem;
        padding: 0.25rem;
        border: 2px solid transparent;
        border-radius: 0.5rem;
        background: var(--sea);
        text-align: center;
        font-size: 0.8rem;
      }
      #dives li strong {
        display: block;
        font-size: 1.4rem;
      }
      #dives li[aria-current="step"] {
        border-color: var(--ink);
      }
      #dives li.blue,
      #dives li.red {
        color: #fff;
      }
      #dives li.blue {
        background: var(--blue);
      }
      #dives li.red {
        background: var(--red);
      }
      table {
        border-collapse: collapse;
        margin: 1rem 0;
      }
      th,
      td {
        padding: 0.25rem 1rem 0.25rem 0;
        text-align: left;
      }
      form {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.75rem;
      }
      input[type="range"] {
        flex: 1 1 10rem;
      }
      output {
        min-width: 2ch;
        font-weight: 700;
      }
      button,
      select {
        font: inherit;
        padding: 0.5rem 1rem;
      }
      #hint,
      #log {
        min-height: 1.4em;
      }
      fieldset {
        border: 0;
        padding: 0;
        margin: 1rem 0;
      }
    </style>
  </head>
  <body>
    <h1>Reef</h1>
    <p>
      Eight dives, 24 divers each. Send divers in secret: the bigger crew takes
      the pearls and uses up its divers, and the other crew keeps theirs.
    </p>
    <ol id="dives" aria-label="Dives"></ol>
    <table>
      <thead>
        <tr>
          <th scope="col"></th>
          <th scope="col" class="blue">You</th>
          <th scope="col" class="red">Red</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <th scope="row">Pearls</th>
          <td id="pearls-blue"></td>
          <td id="pearls-red"></td>
        </tr>
        <tr>
          <th scope="row">Divers left</th>
          <td id="divers-blue"></td>
          <td id="divers-red"></td>
        </tr>
      </tbody>
    </table>
    <p id="hint"></p>
    <form id="bid">
      <label for="send">Divers to send</label>
      <input id="send" type="range" min="0" value="0" />
      <output id="sent" for="send">0</output>
      <button id="dive" type="submit">Dive</button>
    </form>
    <p id="log" role="status" aria-live="polite"></p>
    <fieldset>
      <label for="foe">Red plays</label>
      <select id="foe"></select>
      <button id="again" type="button">New game</button>
    </fieldset>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
