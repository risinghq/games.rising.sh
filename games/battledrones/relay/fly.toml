# The Battle Drones relay (README.md). One machine only: both players of a
# room must reach the same process, so deploy with --ha=false.
app = "battledrones-relay"
primary_region = "sjc"

[build]

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  # Scale to zero: every few minutes Fly's proxy checks for open
  # connections, and with none it suspends the machine (a memory snapshot,
  # no CPU or RAM billed). The next connection resumes it in a few hundred
  # milliseconds; a cold start after a deploy takes a second or two. The
  # server closes forgotten sockets (server.py LONELY_SECONDS and
  # MAX_AGE_SECONDS) so that "none" comes round.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    soft_limit = 2000
    hard_limit = 4000

  [[http_service.checks]]
    grace_period = "5s"
    interval = "30s"
    timeout = "2s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
