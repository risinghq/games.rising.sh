name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Test the LLM plugin (llm-tools-battledrones)
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet -e "llm-tools-battledrones[test]"
          .venv/bin/pytest -q llm-tools-battledrones
      - name: Test the multiplayer relay (relay/)
        run: |
          .venv/bin/pip install --quiet uv
          cd relay && ../.venv/bin/uv run pytest -q
