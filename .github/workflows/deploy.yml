name: deploy

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      targets:
        description: Targets to deploy, space-separated; empty deploys all
        required: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.plan.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          INPUT: ${{ inputs.targets }}
        run: |
          if [ "$EVENT" = workflow_dispatch ] && [ -n "$INPUT" ]; then
            targets=$(jq -cn --arg t "$INPUT" '$t | split(" ") | map(select(. != ""))')
          elif [ "$EVENT" = workflow_dispatch ]; then
            targets=$(bun tools/deploy.ts --changed 0000000)
          else
            targets=$(bun tools/deploy.ts --changed "$BEFORE")
          fi
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          echo "deploying: $targets"

  deploy:
    needs: plan
    if: needs.plan.outputs.targets != '[]'
    runs-on: ubuntu-latest
    environment: production
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
    concurrency:
      group: deploy-${{ matrix.target }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      - run: bun install --frozen-lockfile
      - run: bun run deploy "$TARGET"
        env:
          TARGET: ${{ matrix.target }}
